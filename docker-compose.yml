
services:
  postgres:
    image: postgres:16-alpine
    container_name: hotel_bot_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: hotel_bot
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel_user -d hotel_bot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
